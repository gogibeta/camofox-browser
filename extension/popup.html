<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; padding: 12px; }
    label { display: block; margin-top: 9px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 10px; padding: 7px 12px; cursor: pointer; }
    #status { margin-top: 10px; color: #444; word-break: break-all; min-height: 18px; }
    .small { color: #777; font-size: 11px; margin-top: 8px; }
    .tag { background: #e8f0fe; color: #1a73e8; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <strong>Turnstile Auto Solver</strong> <span class="tag">InstaBox only</span>

  <label>InstaBox API key</label>
  <input id="ibkey" type="password" placeholder="ibk_...">

  <label>InstaBox machine ID</label>
  <input id="ibmachine" type="text">

  <label>InstaBox API URL</label>
  <input id="iburl" type="text">

  <label><input id="auto" type="checkbox"> Auto-solve on page open</label>
  <button id="save">Save</button>
  <button id="solve">Solve this tab</button>
  <div id="status"></div>
  <div class="small">Keys stay in this browser's extension storage. No Apify is used.</div>
  <script src="popup.js"></script>
</body>
</html>
